# The fork's own pipeline: upstream's workflows need upstream's self-hosted runners, so they never
# start here. This one runs the fork's tests on GitHub-hosted runners and builds the static x86_64
# binary la-casa runs.
#
# It is laid out for the shortest time to a verdict. The tests are what says a commit is good, so
# they run alone and in parallel; the static binary takes three times as long and is only built for
# commits that may be deployed.
name: mxg static build

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/**'
      - 'check/**'

permissions:
  contents: read
  # mxg-cache.sh looks for the artifacts of earlier runs.
  actions: read

env:
  # The branch la-casa is deployed from. Its name is also spelled out in the `if` and the
  # `concurrency` of the static job below, where `env` cannot be read.
  DEPLOY_BRANCH: feat/appservice-account-data

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One suite failing says nothing about the other.
      fail-fast: false
      matrix:
        include:
          # Every unit test of the service crate, upstream's along with the fork's. They are all in
          # the one test binary that has to be built anyway and run in seconds, so nobody has to
          # remember to add a new module to a list of filters here.
          - suite: unit
            tests: -p tuwunel_service --lib
          # The tests under src/main/tests start a whole server in-process, and each is a binary of
          # its own that links the whole server. Upstream runs them in its docker bake on its own
          # runners; here only the fork's own are run, by name.
          - suite: integration
            tests: -p tuwunel --test activity_log --test room_export --test user_directory --test user_directory_fanout --test sync_skip_unchanged --test sync_deleted_room
    # A newer push to the same branch makes the verdict on the older one worthless.
    concurrency:
      group: mxg-test-${{ matrix.suite }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      TESTS: ${{ matrix.tests }}
    steps:
      # No disk cleanup: the runner has close to 100 GB free and these jobs use a few. Deleting the
      # preinstalled SDKs took between one and seven minutes of every job.
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      # What is kept between runs is the compiled dependencies and the crates they were compiled
      # from. The dev shell is not kept: it comes out of upstream's binary cache and cache.nixos.org
      # in well under a minute, and a copy of it here would take as long to download.
      #
      # The name carries everything the dependencies' artifacts depend on: the dev shell (compiler,
      # RocksDB, flags) and Cargo.lock. With another Cargo.lock the newest cache of the same dev
      # shell is still used, and cargo rebuilds only what changed.
      - name: Restore the compiled dependencies
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
          SHELL_HASH: ${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'rust-toolchain.toml') }}
          LOCK_HASH: ${{ hashFiles('Cargo.lock') }}
        run: |
          prefix="mxg-cargo-${{ matrix.suite }}-${SHELL_HASH:0:16}-"
          name="$prefix${LOCK_HASH:0:16}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "target=${GITHUB_WORKSPACE#"$HOME"/}/target" >> "$GITHUB_OUTPUT"
          bash .github/workflows/mxg-cache.sh restore "$name" "$prefix" \
            .cargo/registry .cargo/git "${GITHUB_WORKSPACE#"$HOME"/}/target"
      # Compiling and running are two steps so that the run's page says which of them took the time.
      #
      # The dev shell links RocksDB (and so libstdc++) dynamically but doesn't put them on the loader path.
      - name: Compile the tests
        id: compile
        run: |
          nix develop --impure .#dynamic --command bash -euc '
            export LD_LIBRARY_PATH="$ROCKSDB_LIB_DIR:$(dirname "$(c++ -print-file-name=libstdc++.so.6)")"
            cargo test $TESTS --no-run
          '
      - name: Run the tests
        run: |
          nix develop --impure .#dynamic --command bash -euc '
            export LD_LIBRARY_PATH="$ROCKSDB_LIB_DIR:$(dirname "$(c++ -print-file-name=libstdc++.so.6)")"
            cargo test $TESTS
          '
      # After the tests, so that saving never delays the verdict, and also when they failed: the
      # dependencies are just as good then.
      #
      # The fork's own crates are taken out first. A fresh checkout gives every source file a new
      # modification time, which is what cargo goes by for the crates of the workspace, so their
      # artifacts are rebuilt on every run whatever is kept, and they are the largest files there.
      #
      # Neither step may turn a run red: a cache that was not saved only costs the next run time.
      - name: Pack the compiled dependencies
        id: pack
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.cache.outputs.hit != 'exact' }}
        continue-on-error: true
        run: |
          cd "$HOME/${{ steps.cache.outputs.target }}"
          du -sh . ~/.cargo/registry ~/.cargo/git
          find . -depth \( -name '*tuwunel*' -o -name incremental \) -exec rm -rf {} +
          for test in "$GITHUB_WORKSPACE"/src/main/tests/*.rs; do
            find . -path "*/deps/$(basename "$test" .rs)-*" -prune -exec rm -rf {} +
          done
          du -sh .
          bash "$GITHUB_WORKSPACE/.github/workflows/mxg-cache.sh" pack \
            .cargo/registry .cargo/git "${{ steps.cache.outputs.target }}"
      - name: Save the compiled dependencies
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cache.outputs.name }}
          path: ${{ runner.temp }}/mxg-cache.tar.zst
          # It is compressed already.
          compression-level: 0
          retention-days: 90
      - name: Disk space left
        if: ${{ !cancelled() }}
        run: df -h / /nix || true

  # Only for commits that may be deployed: every push to the deploy branch, a run started by hand,
  # and any commit that asks for it with `[static]` in its message. Other branches only run the
  # tests.
  #
  # It does not wait for the tests, so a binary also exists for a commit whose tests failed. The
  # run is red then; look at the run, not only at the artifact, before deploying.
  static:
    name: static
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/feat/appservice-account-data'
      || contains(github.event.head_commit.message, '[static]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # On the deploy branch a build that is under way is never stopped: it may be minutes from the
    # binary someone is waiting to deploy. A newer push waits for it, and of several that wait only
    # the newest is built. Anywhere else the newer push simply replaces the older build.
    concurrency:
      group: mxg-static-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/feat/appservice-account-data' }}
    env:
      PACKAGE: .#static-x86_64-linux-musl
    steps:
      - uses: actions/checkout@v4
      # The directory is a Nix binary cache of this job's own, holding the one store path nobody
      # else has: the compiled dependencies of the static build. Everything else the build needs
      # (compilers, the static RocksDB) comes from upstream's cache, named by the flake itself.
      # What is in the directory is not signed, hence `trusted`; mxg-cache.sh says where it may
      # come from.
      - name: Make room for the dependency cache
        run: mkdir -p "$HOME/mxg-nix-cache"
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = file:///home/runner/mxg-nix-cache?trusted=true
      # The store path of the dependencies is the name of their cache, so a cache is found exactly
      # when it holds what this build is about to ask for: the path changes with Cargo.lock, the
      # manifests, the toolchain and the flake's inputs, and not with the sources.
      - name: Restore the compiled dependencies
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path=$(nix eval --impure --raw "$PACKAGE.cargoArtifacts.outPath")
          hash=$(basename "$path")
          name="mxg-static-deps-${hash:0:32}"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Evaluating made the Nix daemon look into the directory, and it left its skeleton there
          # as root.
          sudo rm -rf "$HOME/mxg-nix-cache"
          bash .github/workflows/mxg-cache.sh restore "$name" '' mxg-nix-cache
      - name: Build the dependencies
        run: nix build --impure -L --no-link "$PACKAGE.cargoArtifacts"
      # Saved before the binary is built, so that a commit that does not compile still leaves the
      # dependencies for the next one.
      #
      # The store path is copied with what it refers to, the sources of every crate: a binary cache
      # does not take a path without them, and those of the crates only the fork uses are in nobody
      # else's cache either. Nothing is compressed here because the big file in the store path is
      # compressed already and mxg-cache.sh compresses the rest.
      #
      # The directory is emptied first for the same reason as above.
      - name: Pack the compiled dependencies
        id: pack
        if: ${{ steps.cache.outputs.hit != 'exact' }}
        continue-on-error: true
        run: |
          sudo rm -rf "$HOME/mxg-nix-cache"
          nix copy --to "file://$HOME/mxg-nix-cache?compression=none" "${{ steps.cache.outputs.path }}"
          du -sh "$HOME/mxg-nix-cache"
          bash .github/workflows/mxg-cache.sh pack mxg-nix-cache
      - name: Save the compiled dependencies
        if: ${{ steps.pack.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cache.outputs.name }}
          path: ${{ runner.temp }}/mxg-cache.tar.zst
          compression-level: 0
          retention-days: 90
      - name: Build static binary
        run: nix build --impure -L "$PACKAGE"
      - name: Collect binary
        run: cp -L result/bin/tuwunel tuwunel && ls -la tuwunel && sha256sum tuwunel
      - uses: actions/upload-artifact@v4
        with:
          name: tuwunel-static-x86_64-${{ github.sha }}
          path: tuwunel
      - name: Disk space left
        if: ${{ !cancelled() }}
        run: df -h / /nix || true
